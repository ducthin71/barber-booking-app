<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kỷ Niệm · Hai hành trình</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#302e2c;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button{border:0}.app{max-width:500px;margin:auto;background:#fffdf9;min-height:100dvh;padding-bottom:90px}.top{display:flex;align-items:center;justify-content:space-between;padding:19px 20px;border-bottom:1px solid #eee8de}.logo{font:700 24px Georgia,serif}.logo span{color:#ad6969}.section{padding:22px 20px}.muted{color:#817d74;font-size:14px;line-height:1.6}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#b57969}.title{font:36px/1.13 Georgia,serif;margin:12px 0}.btn{border-radius:13px;padding:13px 16px;background:#f1e9df;color:#60463d;font-weight:700}.primary{background:#a65d62;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.action{padding:20px 15px;border-radius:21px;text-align:left;min-height:170px;background:#f5e7e1}.action:nth-child(2){background:#e8ece3}.action .emoji{font-size:38px;display:block;margin-bottom:18px}.action b{display:block;font:21px Georgia,serif}.action small{display:block;margin-top:7px;color:#786f67;line-height:1.5}.heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.heading h2{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #eee4db;background:white;border-radius:16px;overflow:hidden;text-align:left}.card .art{height:150px;display:grid;place-items:center;background:#f4e5db;font-size:52px}.card .details{padding:12px}.card b{display:block;font-size:14px}.card small{color:#8b8075}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:#fffdf9f5;border-top:1px solid #ece6dc;display:flex;justify-content:space-around;padding:11px 0 calc(12px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;font-size:11px;color:#887f75;display:grid;gap:4px}.nav strong{font-size:21px}.nav .active{color:#a65d62}.field{width:100%;border:1px solid #e6d9cc;border-radius:12px;padding:13px;background:white;margin:7px 0 16px;outline-color:#a65d62}.label{font-size:13px;font-weight:750}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.chip{padding:12px;border:1px solid #e6d8cb;border-radius:12px;background:white;min-width:90px}.chip.selected{border-color:#a65d62;background:#f8e8e7;color:#a65d62}.back{background:none;color:#a65d62;font-weight:700;padding:0 0 18px}.step{font-size:12px;color:#8b746e;margin-bottom:12px}.paper{min-height:490px;border-radius:3px;box-shadow:0 8px 26px #523a3025;margin:18px 0;padding:24px;position:relative;overflow:hidden}.paper h2{font:italic 33px Georgia,serif;text-align:center;margin:22px 0 10px}.paper .kicker{text-align:center;letter-spacing:3px;font-size:11px}.paper .picture{height:195px;background:#ffffffaa;border:9px solid white;box-shadow:0 4px 16px #0002;transform:rotate(-4deg);margin:30px 6px 14px;display:grid;place-items:center;font-size:65px;overflow:hidden}.paper .picture img{width:100%;height:100%;object-fit:cover}.paper .quote{font:italic 17px/1.5 Georgia,serif;text-align:center;padding:20px 5px;white-space:pre-wrap}.paper .sticker{position:absolute;right:18px;top:85px;font-size:46px;transform:rotate(18deg)}.paper .foot{position:absolute;bottom:15px;left:22px;right:22px;border-top:1px solid #9d776650;padding-top:9px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px}.paper.travel{background:#e2eade}.paper.tet{background:#f4ded4}.paper.love{background:#f5dfe5}.paper.family{background:#e9e2d6}.paper.scrapbook .picture{transform:rotate(5deg);border-radius:2px}.paper.minimal .picture{transform:none;box-shadow:none;border-width:2px}.paper.journal .quote{text-align:left}.paper.editorial h2{text-transform:uppercase;font-weight:700;font-style:normal}.checklist{max-height:320px;overflow:auto}.check{display:flex;align-items:center;gap:10px;border:1px solid #eee2d7;border-radius:12px;padding:12px;margin:7px 0}.check input{width:20px;height:20px;accent-color:#a65d62}.preview-nav{display:flex;justify-content:space-between;align-items:center}.notice{background:#f6f0e8;border-radius:12px;padding:13px;font-size:13px;color:#7c6b61}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#241e1b90;display:grid;place-items:end center;z-index:30}.sheet{width:min(500px,100%);background:#fffdf9;border-radius:24px 24px 0 0;padding:24px 20px 36px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#413731;color:white;border-radius:30px;padding:12px 18px;z-index:40;font-size:13px;white-space:nowrap}@media(min-width:650px){.app{box-shadow:0 0 50px #0000000b}}
</style></head><body><main class="app"><header class="top"><div class="logo">kỷ<span>niệm</span> ✿</div><button class="btn" onclick="startMemory()">＋ Lưu kỷ niệm</button></header><div id="view"></div><nav class="nav"><button onclick="navigate('home')" id="nav-home"><strong>⌂</strong>Trang chủ</button><button onclick="navigate('memories')" id="nav-memories"><strong>▧</strong>Kỷ niệm</button><button onclick="navigate('albums')" id="nav-albums"><strong>▤</strong>Album</button><button onclick="navigate('me')" id="nav-me"><strong>◉</strong>Của tôi</button></nav></main><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script>
const themes={tet:['Tết','#f4ded4','🌸'],travel:['Du lịch','#e2eade','🏞️'],love:['Tình yêu','#f5dfe5','💌'],family:['Gia đình','#e9e2d6','🏡']},styles={scrapbook:'Scrapbook / Collage',editorial:'Tạp chí nghệ thuật',journal:'Nhật ký',minimal:'Tối giản'};
let db;try{db=JSON.parse(localStorage.getItem('kyniem-correct-v1'))}catch(e){}if(!db||!db.memories||!db.albums)db={memories:[],albums:[]};let view='home',wizard={step:1,title:'',theme:'tet',style:'scrapbook',selected:[],prompt:''},activeAlbum=null,activePage=0,editMemory=null,mediaValue='',mediaKind='photo',pendingFiles=[],mediaURLs={};
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem('kyniem-correct-v1',JSON.stringify(db))}catch(e){notify('Bộ nhớ đầy: hãy dùng ảnh nhỏ hơn')}},notify=s=>{const e=$('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)};
const mediaDB=new Promise((resolve,reject)=>{const r=indexedDB.open('kyniem-media-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function putMedia(id,file){const d=await mediaDB;return new Promise((ok,fail)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=ok;tx.onerror=()=>fail(tx.error)})}
async function hydrateMedia(){try{const d=await mediaDB;await Promise.all(db.memories.filter(m=>m.mediaId).map(m=>new Promise(ok=>{const r=d.transaction('files').objectStore('files').get(m.mediaId);r.onsuccess=()=>{if(r.result)mediaURLs[m.id]=URL.createObjectURL(r.result);ok()};r.onerror=ok})));render()}catch(e){console.error(e)}}
function mediaMarkup(m){const src=mediaURLs[m.id]||m.media||'';if(m.kind==='photo'&&src)return '<img style="width:100%;height:100%;object-fit:cover" src="'+src+'">';if(m.kind==='video'&&src)return '<video controls playsinline preload="metadata" style="width:100%;height:100%;max-height:320px;object-fit:contain;background:#111" src="'+src+'"></video>';return m.kind==='video'?'🎬':m.kind==='note'?'📝':'📷'}
function navigate(v){view=v;render();scrollTo(0,0)}function memoryCard(m){return '<button class="card" onclick="detail(\''+m.id+'\')"><div class="art">'+mediaMarkup(m)+'</div><div class="details"><b>'+safe(m.title||'Một kỷ niệm')+'</b><small>'+safe(m.date||'Vừa lưu')+'</small></div></button>'}
function albumCard(a){return '<button class="card" onclick="openAlbum(\''+a.id+'\')"><div class="art" style="background:'+themes[a.theme][1]+'">'+themes[a.theme][2]+'</div><div class="details"><b>'+safe(a.title)+'</b><small>'+a.pages.length+' trang · '+themes[a.theme][0]+'</small></div></button>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+view));let html='';if(view==='home')html='<section class="section"><div class="eyebrow">GÓC NHỎ CỦA NHỮNG ĐIỀU ĐÁNG NHỚ</div><h1 class="title">Giữ khoảnh khắc.<br>Kể câu chuyện.</h1><p class="muted">Lưu kỷ niệm ngay khi nó xảy ra. Khi muốn, hãy biến chúng thành một album được thiết kế theo phong cách riêng.</p><div class="actions"><button class="action" onclick="startMemory()"><span class="emoji">📷</span><b>Lưu kỷ niệm</b><small>Ảnh, video, ghi chú — lưu trước, phân loại sau</small></button><button class="action" onclick="startAlbum()"><span class="emoji">✦</span><b>Tạo album</b><small>Chọn phong cách, nội dung và xem bản dàn trang</small></button></div><div class="heading"><h2>Kỷ niệm gần đây</h2><button class="btn" onclick="navigate(\'memories\')">Xem tất cả</button></div><div class="grid">'+(db.memories.slice(0,4).map(memoryCard).join('')||'<p class="muted">Chưa có kỷ niệm nào. Hãy bắt đầu lưu khoảnh khắc đầu tiên.</p>')+'</div><div class="heading"><h2>Album của bạn</h2></div><div class="grid">'+(db.albums.slice(0,4).map(albumCard).join('')||'<p class="muted">Bạn chưa tạo album.</p>')+'</div></section>';
if(view==='memories')html='<section class="section"><div class="eyebrow">LUỒNG A · LƯU TRỮ ĐỘC LẬP</div><h1 class="title">Kỷ niệm của tôi</h1><p class="muted">Không cần chọn album. Mỗi kỷ niệm có thể dùng trong nhiều album mà không mất bản gốc.</p><button class="btn primary" onclick="startMemory()">＋ Lưu kỷ niệm</button><input class="field" placeholder="Tìm kỷ niệm..." oninput="filterMemories(this.value)"><div class="grid" id="memoryGrid">'+db.memories.map(memoryCard).join('')+'</div></section>';
if(view==='albums')html='<section class="section"><div class="eyebrow">LUỒNG B · THIẾT KẾ CÂU CHUYỆN</div><h1 class="title">Album</h1><p class="muted">Những cuốn album nhiều trang được dàn theo chủ đề và phong cách bạn chọn.</p><button class="btn primary" onclick="startAlbum()">✦ Tạo album mới</button><div class="grid" style="margin-top:20px">'+(db.albums.map(albumCard).join('')||'<p class="muted">Chưa có album nào.</p>')+'</div></section>';
if(view==='me')html='<section class="section"><div class="eyebrow">TÀI KHOẢN</div><h1 class="title">Của tôi</h1><div class="notice">Đây là prototype chạy trên thiết bị. Chưa có đăng nhập, AI thật, cộng tác trực tuyến hay đồng bộ đám mây.</div><p class="muted">'+db.memories.length+' kỷ niệm · '+db.albums.length+' album</p></section>';
if(view==='wizard')html=renderWizard();if(view==='album')html=renderAlbum();$('view').innerHTML=html}
function filterMemories(q){$('memoryGrid').innerHTML=db.memories.filter(m=>(m.title+' '+m.note).toLowerCase().includes(q.toLowerCase())).map(memoryCard).join('')}
function startMemory(){mediaValue='';mediaKind='photo';pendingFiles=[];$('modal').classList.remove('hidden');$('modal').innerHTML='<div class="sheet"><button class="btn" onclick="closeModal()">✕ Đóng</button><h2>Lưu một kỷ niệm</h2><p class="muted">Chỉ cần chọn loại nội dung và lưu. Tên, ghi chú và album đều không bắt buộc.</p><div class="row"><button class="chip selected" onclick="setKind(\'photo\',this)">📷 Ảnh</button><button class="chip" onclick="setKind(\'video\',this)">🎬 Video</button><button class="chip" onclick="setKind(\'note\',this)">📝 Ghi chú</button></div><div id="upload"><input class="field" type="file" accept="image/*,video/*" multiple onchange="readMedia(event)"><div id="uploadPreview" class="grid"></div></div><label class="label">Tên (không bắt buộc)</label><input class="field" id="memTitle" placeholder="Khoảnh khắc của tôi"><label class="label">Ghi chú (không bắt buộc)</label><textarea class="field" id="memNote" rows="3" placeholder="Bạn muốn nhớ điều gì?"></textarea><button class="btn primary" style="width:100%" onclick="saveMemory()">Lưu vào bộ sưu tập</button></div>'}
function setKind(k,b){mediaKind=k;pendingFiles=[];document.querySelectorAll('.sheet .chip').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('upload').innerHTML=k==='note'?'':'<input class="field" type="file" multiple accept="'+(k==='video'?'video/*':'image/*')+'" onchange="readMedia(event)"><div id="uploadPreview" class="grid"></div><p class="muted">Chọn nhiều tệp cùng lúc. Ảnh và video được lưu trên thiết bị.</p>'}
function readMedia(e){pendingFiles=Array.from(e.target.files||[]);if($('uploadPreview'))$('uploadPreview').innerHTML=pendingFiles.map(f=>'<div class="notice">'+(f.type.startsWith('video/')?'🎬 ':'🖼️ ')+safe(f.name)+'</div>').join('');notify('Đã chọn '+pendingFiles.length+' tệp')}
async function saveMemory(){const title=$('memTitle').value.trim(),note=$('memNote').value.trim(),date=new Date().toLocaleDateString('vi-VN'),files=mediaKind==='note'?[]:pendingFiles;if(!files.length)db.memories.unshift({id:'m'+Date.now(),kind:mediaKind,title:title||'Một kỷ niệm',note,media:'',date});else{let n=0;for(const file of files){const id='m'+Date.now()+'-'+n++;try{await putMedia(id,file);db.memories.unshift({id,mediaId:id,kind:file.type.startsWith('video/')?'video':'photo',title:title||(files.length>1?file.name:'Một kỷ niệm'),note,date});mediaURLs[id]=URL.createObjectURL(file)}catch(e){notify('Không đủ dung lượng lưu '+file.name)}}}save();closeModal();navigate('memories');notify('Đã lưu kỷ niệm')}
function closeModal(){$('modal').classList.add('hidden')}
function detail(id){const m=db.memories.find(x=>x.id===id);$('modal').classList.remove('hidden');$('modal').innerHTML='<div class="sheet"><button class="btn" onclick="closeModal()">✕ Đóng</button><h2>'+safe(m.title)+'</h2><p>'+safe(m.note||'Chưa có ghi chú')+'</p><div style="max-height:55dvh;overflow:auto">'+mediaMarkup(m)+'</div><p class="muted">Bản gốc luôn nằm trong bộ sưu tập.</p><button class="btn" style="color:#a33e46;width:100%;margin-top:10px" onclick="deleteMemory(\''+m.id+'\')">🗑 Xóa kỷ niệm</button></div>'}
async function deleteMemory(id){const m=db.memories.find(x=>x.id===id);if(!m||!confirm('Xóa kỷ niệm này? Kỷ niệm cũng sẽ bị gỡ khỏi các album sử dụng nó.'))return;db.memories=db.memories.filter(x=>x.id!==id);for(const a of db.albums){a.items=a.items.filter(x=>x!==id);a.pages=a.pages.filter(p=>!p.items?.includes(id))}if(m.mediaId){try{const d=await mediaDB;d.transaction('files','readwrite').objectStore('files').delete(m.mediaId)}catch(e){console.error(e)}}if(mediaURLs[id]){URL.revokeObjectURL(mediaURLs[id]);delete mediaURLs[id]}save();closeModal();render();notify('Đã xóa kỷ niệm')}
function startAlbum(){wizard={step:1,title:'',theme:'tet',style:'scrapbook',selected:[],prompt:''};navigate('wizard')}
function renderWizard(){let w=wizard,body='';if(w.step===1)body='<label class="label">Mô tả album bạn muốn AI thiết kế</label><textarea class="field" style="min-height:180px;line-height:1.6" placeholder="Ví dụ: Album Tết sum vầy, ấm áp, màu đỏ vàng, bố cục tạp chí, có lời nhắn..." oninput="wizard.prompt=this.value">'+safe(w.prompt||'')+'</textarea><p class="muted">Gợi ý nhanh (không bắt buộc)</p><div class="row">'+Object.entries(themes).map(([id,t])=>'<button style="font-size:12px;flex:0 0 auto;padding:9px;background:#fff;color:#776c63;border-color:#e6d8cb" class="chip" onclick="wizard.theme=\''+id+'\';wizard.prompt+=(wizard.prompt?\', \':\'\')+\'Chủ đề '+t[0]+'\';render()">'+t[2]+' '+t[0]+'</button>').join('')+'</div><div class="row" style="margin-top:8px">'+Object.entries(styles).map(([id,t])=>'<button style="font-size:12px;flex:0 0 auto;padding:9px;background:#fff;color:#776c63;border-color:#e6d8cb" class="chip" onclick="wizard.style=\''+id+'\';wizard.prompt+=(wizard.prompt?\', \':\'\')+\'phong cách '+t+'\';render()">'+t+'</button>').join('')+'</div><label class="label" style="display:block;margin-top:18px">Tên album (không bắt buộc)</label><input id="albumTitle" class="field" placeholder="Tên album" value="'+safe(w.title)+'" oninput="wizard.title=this.value">';
if(w.step===2)body='<h2>Chọn kỷ niệm để kể</h2><p class="muted">Dùng lại những kỷ niệm đã lưu. Bạn cũng có thể lưu thêm ở luồng A và quay lại.</p><div class="checklist">'+(db.memories.map(m=>'<label class="check"><input type="checkbox" '+(w.selected.includes(m.id)?'checked':'')+' onchange="toggleSelected(\''+m.id+'\',this.checked)"><span>'+safe(m.title)+' · '+safe(m.kind)+'</span></label>').join('')||'<p class="notice">Chưa có kỷ niệm. Bạn vẫn có thể tạo album mẫu hoặc quay lại lưu nội dung.</p>')+'</div>';
if(w.step===3)body='<h2>Chuẩn bị dàn trang ✦</h2><p class="muted">Chủ đề: '+themes[w.theme][0]+' · '+styles[w.style]+' · '+w.selected.length+' kỷ niệm</p><div class="notice">Bản prototype mô phỏng quá trình AI dàn trang bằng nhiều bố cục có sẵn. Chưa kết nối AI thật và không trừ phí.</div><button class="btn primary" style="width:100%;margin-top:18px" onclick="generateAlbum()">✦ Tạo bản xem trước</button>';
return '<section class="section"><button class="back" onclick="navigate(\'albums\')">← Album</button><div class="eyebrow">TẠO ALBUM</div><h1 class="title">Kể câu chuyện của bạn</h1><div class="step">Bước '+w.step+'/3 · '+(['','Chủ đề & phong cách','Chọn nội dung','Dàn trang'][w.step])+'</div>'+body+'<div class="row" style="margin-top:25px">'+(w.step>1?'<button class="btn" onclick="wizard.step--;render()">← Quay lại</button>':'')+(w.step<3?'<button class="btn primary" onclick="wizard.step++;render()">Tiếp tục →</button>':'')+'</div></section>'}
function toggleSelected(id,on){wizard.selected=on?[...wizard.selected,id]:wizard.selected.filter(x=>x!==id)}
function generateAlbum(){const selected=wizard.selected.map(id=>db.memories.find(m=>m.id===id)).filter(Boolean);const pages=[{title:wizard.title||wizard.prompt.slice(0,46)||'Chuyện của chúng mình',type:'cover',items:[]},...selected.map((m,i)=>({title:m.title,type:i%3===0?'collage':i%3===1?'story':'feature',items:[m.id]})),{title:'Những điều còn ở lại ♡',type:'ending',items:[]}];const a={id:'a'+Date.now(),title:wizard.title||wizard.prompt.slice(0,46)||'Album của tôi',prompt:wizard.prompt,theme:wizard.theme,style:wizard.style,items:wizard.selected.slice(),pages,accepted:false};db.albums.unshift(a);save();openAlbum(a.id);notify('Đã tạo bản dàn trang mô phỏng')}
function openAlbum(id){activeAlbum=id;activePage=0;navigate('album')}
function current(){return db.albums.find(a=>a.id===activeAlbum)}
function renderAlbum(){const a=current();if(!a)return '<section class="section">Không tìm thấy album</section>';const p=a.pages[activePage],m=p.items?.map(id=>db.memories.find(x=>x.id===id)).filter(Boolean)[0];const t=themes[a.theme];let content='<div class="kicker">'+safe(t[0].toUpperCase())+' · '+safe(styles[a.style])+'</div><h2>'+safe(p.title)+'</h2><span class="sticker">'+t[2]+'</span>';if(p.type==='cover')content+='<div class="picture">'+t[2]+'</div><div class="quote">Một cuốn album, ngàn điều để nhớ.</div>';else if(p.type==='ending')content+='<div class="quote" style="margin-top:120px">Cảm ơn vì đã là một phần của câu chuyện này.</div>';else content+='<div class="picture">'+(m?mediaMarkup(m):t[2])+'</div><div class="quote">'+safe(m?.note||'Có những khoảnh khắc chẳng cần lời giải thích.')+'</div>';content+='<div class="foot"><span>KỶ NIỆM</span><span>'+String(activePage+1).padStart(2,'0')+' / '+String(a.pages.length).padStart(2,'0')+'</span></div>';return '<section class="section"><button class="back" onclick="navigate(\'albums\')">← Tất cả album</button><div class="eyebrow">'+(a.accepted?'ALBUM ĐÃ LƯU':'XEM TRƯỚC TOÀN BỘ ALBUM')+'</div><h1 class="title">'+safe(a.title)+'</h1><div class="preview-nav"><button class="btn" onclick="turn(-1)">← Trước</button><b>Trang '+(activePage+1)+' / '+a.pages.length+'</b><button class="btn" onclick="turn(1)">Sau →</button></div><div class="paper '+a.theme+' '+a.style+'">'+content+'</div><div class="row"><button class="btn" onclick="redesign()">✦ Thiết kế lại</button><button class="btn primary" onclick="acceptAlbum()">✓ '+(a.accepted?'Đã lưu':'Chấp nhận & lưu')+'</button></div><div class="row" style="margin-top:10px"><button class="btn" onclick="addToAlbum()">＋ Thêm kỷ niệm</button><button class="btn" onclick="shareAlbum()">↗ Chia sẻ</button></div><p class="muted">Dàn trang mô phỏng, không phải kết quả AI thật. Kỷ niệm gốc không bị thay đổi.</p></section>'}
function turn(n){const a=current();activePage=Math.max(0,Math.min(a.pages.length-1,activePage+n));render()}function acceptAlbum(){current().accepted=true;save();render();notify('Đã lưu album')}
function redesign(){const a=current();const keys=Object.keys(styles);a.style=keys[(keys.indexOf(a.style)+1)%keys.length];a.accepted=false;save();render();notify('Đã đổi bố cục, giữ nguyên nội dung gốc')}
function addToAlbum(){const a=current(),available=db.memories.filter(m=>!a.items.includes(m.id));$('modal').classList.remove('hidden');$('modal').innerHTML='<div class="sheet"><button class="btn" onclick="closeModal()">✕ Đóng</button><h2>Thêm vào album</h2>'+(available.map(m=>'<button class="chip" style="display:block;width:100%;margin:8px 0" onclick="attach(\''+m.id+'\')">'+safe(m.title)+'</button>').join('')||'<p class="muted">Không còn kỷ niệm mới. Bạn có thể lưu thêm ở tab Kỷ niệm.</p>')+'</div>'}
function attach(id){const a=current(),m=db.memories.find(x=>x.id===id);a.items.push(id);a.pages.splice(a.pages.length-1,0,{title:m.title,type:'story',items:[id]});save();closeModal();render();notify('Đã thêm, không ảnh hưởng bản gốc')}
function shareAlbum(){notify('Chia sẻ và cộng tác thật sẽ có ở phiên bản sau')}
hydrateMedia();
</script></body></html>
