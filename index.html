function shuffled(arr){const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function sliceItems(a,p){const ids=[...(p.items||[]),...(a.items||[])];const seen=new Set();const matches=[];for(const id of ids){if(seen.has(id))continue;seen.add(id);const m=db.memories.find(x=>x.id===id);if(m)matches.push(m)}return matches.slice(0,4)}
function sliceMedia(m,index,demo,interactive=false,readerPreview=false,homePreview=false){

 if(!src)return '<span style="display:grid;place-items:center;height:100%;font-size:30px">'+(m.kind==='note'?'✎':'📷')+'</span>';

 if(m.kind==='video')return '<video '+(interactive?'controls ':'muted ')+'playsinline preload="metadata" src="'+src+'"></video>'+(interactive?'':'<span class="play-mark">▶ Video</span>');

}

/* ONE CONTINUOUS CHRONICLE: generated from the original library, never duplicates files. */
function chronicleSettings(){
 if(!db.mainBook||typeof db.mainBook!=='object')db.mainBook={};
 const c=db.mainBook;
 if(!Array.isArray(c.excludedIds))c.excludedIds=[];
 if(!c.chapters||typeof c.chapters!=='object')c.chapters={};
 if(!c.pageEdits||typeof c.pageEdits!=='object')c.pageEdits={};
 return c;
}
function memoryDate(m){
 if(m.eventDate&&/^\d{4}-\d\d-\d\d$/.test(m.eventDate)){const d=new Date(m.eventDate+'T12:00:00');if(!isNaN(d.getTime()))return d}
 const v=String(m.date||'').trim(),vn=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(vn){const d=new Date(+vn[3],+vn[2]-1,+vn[1],12);if(d.getFullYear()==+vn[3]&&d.getMonth()==+vn[2]-1)return d}
 if(m.createdAt){const d=new Date(m.createdAt);if(!isNaN(d.getTime()))return d}
 const d=new Date(v);return isNaN(d.getTime())?new Date():d;
}
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function vietnamMonth(m){return ['Tháng Giêng','Tháng Hai','Tháng Ba','Tháng Tư','Tháng Năm','Tháng Sáu','Tháng Bảy','Tháng Tám','Tháng Chín','Tháng Mười','Tháng Mười Một','Tháng Chạp'][m-1]||'Tháng '+m}
function normalizeEvent(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'everyday'}

/* Imported file names are metadata, not user-facing titles. Preserve old records unchanged. */
function looksLikeFileName(value){
 const v=String(value??'').trim();if(!v)return false;
 const leaf=v.split(/[\\/]/).pop();
 return /\.(jpe?g|png|heic|heif|webp|gif|bmp|avif|tiff?|svg|mp4|mov|m4v|avi|mkv|webm|3gp|m4a)$/i.test(leaf)||
 /^(?:img|dsc|dscf|dji|pxl|vid|video|photo|screenshot|screen[\s_-]*shot|image|mvimg|wa|zalo)[_\s.-]?[0-9a-z_-]*\d[\w-]*$/i.test(leaf)||
 /^(?:\d{8}[-_]\d{6,}|\d{13,}|[0-9a-f]{8}-[0-9a-f-]{13,})$/i.test(leaf);
}
function displayTitle(value,fallback='Khoảnh khắc đáng nhớ'){
 const v=String(value??'').trim();return !v||looksLikeFileName(v)?fallback:v;
}
function memoryDisplayTitle(m){return displayTitle(m?.title,m?.kind==='note'?'Ghi chú':'Khoảnh khắc đáng nhớ')}
window.KyniemLabels={title:displayTitle,memoryTitle:(m,fallback)=>displayTitle(m?.title,fallback||'Khoảnh khắc đáng nhớ')};

function meaningfulName(s){const v=String(s||'').trim();return !!v&&!looksLikeFileName(v)&&v.length<65&&!['Một kỷ niệm','Một khoảnh khắc','Khoảnh khắc đáng nhớ','Ghi chú','Một kỷ niệm đáng nhớ'].includes(v)}
function eventOfMemory(m,d){
 if(String(m.eventName||'').trim())return String(m.eventName).trim().slice(0,80);
 const text=(m.title+' '+(m.note||'')).toLowerCase();
 if(/valentine|14\s*\/\s*2|14-2|lễ tình nhân/.test(text))return 'Valentine '+d.getFullYear();
 if(/đi chơi tết|du xuân|chơi xuân/.test(String(m.title||'').toLowerCase()))return 'Đi chơi Tết';
 if(/tết|lì xì|giao thừa|sum vầy/.test(String(m.title||'').toLowerCase()))return 'Tết sum vầy';
 if(/đi chơi tết|du xuân|chơi xuân/.test(text))return 'Đi chơi Tết';
 if(/tết|lì xì|giao thừa|sum vầy/.test(text))return 'Tết sum vầy';
 if(/sinh nhật|birthday/.test(text))return 'Sinh nhật';
 if(/đà lạt|da lat/.test(text))return 'Chuyến đi Đà Lạt';
 if(/du lịch|đi chơi|chuyến đi|trip|biển|travel/.test(text))return 'Những chuyến đi';
 if(/kỷ niệm ngày cưới|đám cưới|wedding/.test(text))return 'Kỷ niệm tình yêu';
 if(meaningfulName(m.title))return String(m.title).trim().slice(0,58);
 return 'Những ngày đáng nhớ';
}
function eventDesign(name,i){
 const s=name.toLowerCase();
 if(/tết|xuân|giao thừa/.test(s))return {theme:'tet',style:'scrapbook',mood:'Rộn ràng, ấm áp',symbol:'🌸',variant:1};
 if(/valentine|tình yêu|cưới|hẹn hò/.test(s))return {theme:'love',style:'journal',mood:'Dịu dàng, lãng mạn',symbol:'♡',variant:2};
 if(/chuyến|du lịch|đi chơi|đà lạt|biển/.test(s))return {theme:'travel',style:'editorial',mood:'Tự do, rực rỡ',symbol:'✈',variant:3};
 if(/gia đình|sum họp|sinh nhật/.test(s))return {theme:'family',style:'scrapbook',mood:'Thân thương, gần gũi',symbol:'✿',variant:0};
 const picks=['family','travel','love','tet'];return {theme:picks[i%4],style:['journal','editorial','scrapbook','minimal'][i%4],mood:'Mộc mạc, đáng nhớ',symbol:'✦',variant:i%5};
}
function chronicleModel(){
 const settings=chronicleSettings(),excluded=new Set(settings.excludedIds);
 const sorted=db.memories.map((m,i)=>({m,i,date:memoryDate(m)})).filter(x=>!excluded.has(x.m.id)).sort((a,b)=>a.date-b.date||b.i-a.i);
 const map=new Map();
 for(const x of sorted){
  const monthKey=x.date.getFullYear()+'-'+String(x.date.getMonth()+1).padStart(2,'0');
  const label=eventOfMemory(x.m,x.date),key=monthKey+'|'+normalizeEvent(label);
  if(!map.has(key))map.set(key,{key,monthKey,rawTitle:label,items:[],firstDate:x.date});
  map.get(key).items.push(x.m);
 }
 const chapters=[...map.values()].map((ch,i)=>({...ch,...eventDesign(ch.rawTitle,i),...(settings.chapters[ch.key]||{})}));
 const monthMap=new Map();for(const ch of chapters){if(!monthMap.has(ch.monthKey))monthMap.set(ch.monthKey,[]);monthMap.get(ch.monthKey).push(ch)}
 const pages=[{id:'cover',type:'chronicle-cover',title:'Cuốn Kỷ Niệm Của Tôi',items:sorted.slice(0,4).map(x=>x.m.id),theme:'family',style:'editorial',variant:0,caption:'Từng ngày mình đi qua đều đáng được ghi nhớ.'}];
 for(const [monthKey,events] of monthMap){
  const [year,month]=monthKey.split('-').map(Number),monthTitle=vietnamMonth(month)+' '+year;
  pages.push({id:'month-'+monthKey,type:'month-divider',title:monthTitle,monthKey,year,month,theme:events[0].theme,variant:events[0].variant,chapterCount:events.length,memoryCount:events.reduce((n,ch)=>n+ch.items.length,0),items:[]});
  for(const ch of events){
   pages.push({id:'chapter-'+ch.key,type:'chapter-divider',title:ch.title||ch.rawTitle,subtitle:monthTitle,chapterKey:ch.key,theme:ch.theme,style:ch.style,mood:ch.mood,icon:ch.symbol,items:ch.items.slice(0,3).map(m=>m.id),variant:ch.variant});
   for(let i=0;i<ch.items.length;i+=4){
    const items=ch.items.slice(i,i+4);
    const pageId='story-'+ch.key+'-'+items.map(x=>x.id).join('_');
    const edit=settings.pageEdits[pageId]||{};
    pages.push({id:pageId,type:'chronicle-story',title:ch.title||ch.rawTitle,chapterKey:ch.key,theme:ch.theme,style:ch.style,mood:ch.mood,items:items.map(m=>m.id),variant:(ch.variant+1+i/4)%5,caption:items.find(m=>m.note)?.note||'Có những khoảnh khắc sẽ mãi ở lại.',...edit});
   }
  }
 }
 pages.push({id:'continuing',type:'chronicle-ending',title:'Câu chuyện vẫn đang viết tiếp…',items:[],theme:'family',variant:4});
 return {pages,chapters,months:[...monthMap.keys()],count:sorted.length};
}

let latestTrashBatch=[];
function showUndo(count){
 const e=$('toast');e.classList.remove('hidden');e.replaceChildren();
 const t=document.createElement('span');t.textContent='Đã chuyển '+count+' kỷ niệm vào Thùng rác';
 const b=document.createElement('button');b.type='button';b.textContent='Hoàn tác';b.onclick=()=>{for(const id of latestTrashBatch.slice().reverse())restoreTrash(id,true);latestTrashBatch=[];render();notify('Đã khôi phục '+count+' kỷ niệm')};
 e.append(t,b);setTimeout(()=>{if(e.contains(b))e.classList.add('hidden')},8500);

function trashMemories(ids){
 const set=new Set(ids);let count=0;latestTrashBatch=[];
 for(const id of set){
  const index=db.memories.findIndex(m=>m.id===id);if(index<0)continue;
  const memory=db.memories[index];
  const refs=db.albums.map(a=>({albumId:a.id,indices:(a.items||[]).flatMap((x,i)=>x===id?[i]:[]),pages:(a.pages||[]).flatMap((p,i)=>(p.items||[]).includes(id)?[{i,page:JSON.parse(JSON.stringify(p))}]:[])})).filter(x=>x.indices.length||x.pages.length);
  db.trash.unshift({memory,index,refs,deletedAt:Date.now()});latestTrashBatch.push(id);count++;
 }
 if(!count)return;
 db.memories=db.memories.filter(m=>!set.has(m.id));
 for(const a of db.albums){
  a.items=(a.items||[]).filter(id=>!set.has(id));
  a.pages=(a.pages||[]).map(p=>({...p,items:(p.items||[]).filter(id=>!set.has(id))}));
 }
 save();render();showUndo(count);
}
function restoreTrash(id,silent=false){
 const i=db.trash.findIndex(x=>x.memory.id===id);if(i<0)return;
 const item=db.trash.splice(i,1)[0];
 if(!db.memories.some(m=>m.id===id))db.memories.splice(Math.min(item.index,db.memories.length),0,item.memory);
 for(const ref of item.refs){
  const a=db.albums.find(x=>x.id===ref.albumId);if(!a)continue;
  a.items=a.items||[];a.pages=a.pages||[];
  for(const pos of ref.indices){if(!a.items.includes(id))a.items.splice(Math.min(pos,a.items.length),0,id)}
  for(const p of ref.pages){const currentPage=a.pages[p.i];if(currentPage){currentPage.items=currentPage.items||[];for(let n=0;n<p.page.items.length;n++)if(p.page.items[n]===id&&!currentPage.items.includes(id))currentPage.items.splice(Math.min(n,currentPage.items.length),0,id)}else{const recovered={...p.page,items:(p.page.items||[]).filter(x=>x===id||db.memories.some(m=>m.id===x))};a.pages.splice(Math.min(p.i,a.pages.length),0,recovered)}}
 }
 save();if(!silent){render();notify('Đã khôi phục kỷ niệm')}
}

async function permanentlyDeleteTrash(id){
 const i=db.trash.findIndex(x=>x.memory.id===id);if(i<0)return;
 if(!confirm('Xóa vĩnh viễn kỷ niệm này? Không thể khôi phục.'))return;
 const entry=db.trash.splice(i,1)[0];
 if(entry.memory.mediaId){try{const d=await mediaDB;await new Promise((ok,fail)=>{const tx=d.transaction('files','readwrite');tx.objectStore('files').delete(entry.memory.mediaId);tx.oncomplete=ok;tx.onerror=fail})}catch(e){console.error(e);db.trash.splice(i,0,entry);notify('Không xóa được dữ liệu. Hãy thử lại.');return}}
 if(mediaURLs[id]){URL.revokeObjectURL(mediaURLs[id]);delete mediaURLs[id]}
 save();render();notify('Đã xóa vĩnh viễn');
}

const backupLimit=75*1024*1024;
function showBackupStatus(message){notify(message)}
async function exportBackup(){
 try{
  const all=[...db.memories,...db.trash.map(x=>x.memory)];
  const media=all.filter(m=>m.mediaId);
  const d=await mediaDB;const payload=[];
  let size=0;
  showBackupStatus('Đang chuẩn bị bản sao lưu…');
  for(const m of media){
   const blob=await new Promise((ok,fail)=>{const req=d.transaction('files','readonly').objectStore('files').get(m.mediaId);req.onsuccess=()=>ok(req.result);req.onerror=()=>fail(req.error)});
   if(!blob){showBackupStatus('Có tệp bị thiếu. Không thể tạo bản sao lưu đầy đủ.');return}
   size+=blob.size;
   if(size>backupLimit){showBackupStatus('Dữ liệu trên 75 MB: bản sao lưu qua trình duyệt chưa hỗ trợ. Đừng xóa dữ liệu website.');return}
   const data=await new Promise((ok,fail)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=()=>fail(reader.error);reader.readAsDataURL(blob)});
   payload.push({id:m.mediaId,data});
  }
  const contents=JSON.stringify({version:1,app:'kyniem',exportedAt:new Date().toISOString(),records:db,media:payload});
  const url=URL.createObjectURL(new Blob([contents],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='kyniem-sao-luu-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  notify('Đã tạo tệp sao lưu. Hãy lưu tệp ở nơi an toàn.');
 }catch(e){console.error(e);notify('Không xuất được bản sao. Vui lòng thử lại.')}
}
async function importBackup(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 if(!confirm('Khôi phục bản sao lưu sẽ thay thế thư viện và album hiện tại trên thiết bị này. Bạn có muốn tiếp tục?'))return;
 try{
  const parsed=JSON.parse(await file.text());
  if(parsed.app!=='kyniem'||parsed.version!==1||!Array.isArray(parsed.records?.memories)||!Array.isArray(parsed.records?.albums)||!Array.isArray(parsed.media))throw Error('Invalid backup');
  if(parsed.media.length>2000)throw Error('Too many files');
  const total=parsed.media.reduce((n,m)=>n+(m.data?.length||0),0);if(total>backupLimit*1.5)throw Error('File too large');
  const d=await mediaDB;
  for(const m of parsed.media){
   if(typeof m.id!=='string'||!/^data:(image|video)\//.test(m.data||''))throw Error('Invalid media');
   const blob=await (await fetch(m.data)).blob();await putMedia(m.id,blob);
  }
  for(const url of Object.values(mediaURLs))URL.revokeObjectURL(url);
  mediaURLs={};db={...parsed.records,trash:Array.isArray(parsed.records.trash)?parsed.records.trash:[],albumTrash:Array.isArray(parsed.records.albumTrash)?parsed.records.albumTrash:[]};
  save();await hydrateMedia();navigate('memories');notify('Đã khôi phục bản sao lưu.');
 }catch(e){console.error(e);notify('Bản sao lưu không hợp lệ hoặc không thể khôi phục. Dữ liệu cũ chưa bị thay thế.')}
}
async function requestLocalProtection(){

  const granted=await navigator.storage.persist();
  notify(granted?'Đã bật lưu trữ bền vững trên thiết bị.':'Trình duyệt chưa cấp quyền. Hãy sao lưu thường xuyên.');
 }catch(e){notify('Không thể yêu cầu quyền lưu trữ.')}
}

if(w.step===2)body='<h2>Chọn kỷ niệm để kể</h2><button class="btn" style="margin-bottom:12px" onclick="startMemory()">＋ Thêm ảnh/video mới</button><p class="muted">Chạm vào ảnh, video hoặc ghi chú để thêm vào album. Có thể chọn nhiều mục và thay đổi kích thước ảnh như trong Thư viện.</p><div class="wizard-library"><div class="wizard-summary"><strong id="wizardCount">'+w.selected.length+' đã chọn</strong><button class="library-round" id="wizardAllButton" onclick="toggleAllWizard()">Chọn tất cả</button></div><input class="field library-search" id="wizardSearch" placeholder="⌕ Tìm kỷ niệm" value="'+safe(wizardSearch)+'" oninput="wizardSearch=this.value;updateWizardGrid()"><div class="wizard-tools"><span class="zoom-caption">Thu nhỏ</span><input id="wizardSlider" type="range" min="2" max="7" value="'+libraryCols+'" step="1" aria-label="Thay đổi kích thước ảnh" oninput="changeLibraryCols(this.value,\'wizardGrid\')"><span id="wizardColsLabel" class="zoom-caption">'+libraryCols+' cột</span></div><div class="library-grid" id="wizardGrid" style="--library-cols:'+libraryCols+'">'+wizardTiles()+'</div><div class="wizard-note">Ảnh/video được chọn từ kho kỷ niệm; bản gốc vẫn được giữ nguyên.</div></div>';
if(w.step===3)body='<h2>Chuẩn bị dàn trang ✦</h2><p class="muted">Chủ đề: '+themes[inferAlbumTheme()][0]+' · '+styles[inferAlbumStyle()]+' · '+w.selected.length+' kỷ niệm</p><div class="notice">App hiện dàn trang theo các mẫu collage có sẵn, chưa dùng AI thật để hiểu mô tả. Bạn có thể xem trước và đổi bố cục.</div><button class="btn primary" style="width:100%;margin-top:18px" onclick="generateAlbum()">✦ Tạo bản xem trước</button>';
return '<section class="section"><button class="back" onclick="navigate(\'albums\')">← Album</button><button class="btn" style="float:right;font-size:12px" onclick="restartAlbum()">Bắt đầu lại</button><div class="eyebrow">TẠO ALBUM</div><h1 class="title">Kể câu chuyện của bạn</h1><div class="step">Bước '+w.step+'/3 · '+(['','Chủ đề & phong cách','Chọn nội dung','Dàn trang'][w.step])+'</div>'+body+'<div class="row" style="margin-top:25px">'+(w.step>1?'<button class="btn" onclick="wizardBack()">← Quay lại</button>':'')+(w.step<3?'<button class="btn primary" onclick="advanceWizard()">Tiếp tục →</button>':'')+'</div></section>'}
function wizardBack(){wizard.step=Math.max(1,wizard.step-1);saveWizardDraft();render();scrollTo(0,0)}
function advanceWizard(){
 if(wizard.step===1&&!wizard.prompt.trim()){notify('Hãy mô tả câu chuyện bạn muốn thiết kế.');return}
 if(wizard.step===2&&!wizard.selected.length){notify('Hãy chọn ít nhất một kỷ niệm. Có thể bấm ＋ để tải thêm ảnh/video.');return}
 wizard.step=Math.min(3,wizard.step+1);saveWizardDraft();render();scrollTo(0,0)
}
function visibleWizardMemories(){return db.memories.filter(m=>(m.title+' '+m.note).toLowerCase().includes(wizardSearch.toLowerCase()))}
function wizardTile(m){
 const src=mediaURLs[m.id]||m.media||'';
 const visual=m.kind==='photo'&&src?'<img loading="lazy" src="'+src+'">':m.kind==='video'&&src?'<video muted playsinline preload="metadata" src="'+src+'"></video><span class="duration">▶</span>':m.kind==='note'?'📝':'📷';
 const number=wizard.selected.indexOf(m.id)+1;
 return '<button type="button" aria-pressed="'+(number>0)+'" aria-label="'+safe(memoryDisplayTitle(m))+(number>0?' · Đã chọn':'')+'" class="library-tile '+(number>0?'is-selected':'')+'" onclick="wizardTap(\''+m.id+'\')">'+visual+'<span class="tick '+(number>0?'numbered':'')+'">'+(number>0?number:'')+'</span></button>';
}
function wizardTiles(){
 const matches=visibleWizardMemories();
 return matches.length?matches.map(wizardTile).join(''):'<div class="wizard-empty" style="grid-column:1/-1">'+(db.memories.length?'Không có kỷ niệm phù hợp. Hãy thử từ khóa khác.':'Bạn chưa có kỷ niệm. Hãy vào tab Kỷ niệm để tải ảnh hoặc video lên.')+'</div>';
}
function updateWizardGrid(){
 saveWizardDraft();const grid=$('wizardGrid');if(grid)grid.innerHTML=wizardTiles();
 const count=$('wizardCount');if(count)count.textContent=wizard.selected.length+' đã chọn';
 const all=$('wizardAllButton');
 if(all){const found=visibleWizardMemories();all.textContent=found.length&&found.every(m=>wizard.selected.includes(m.id))?'Bỏ chọn tất cả':'Chọn tất cả'}
}
function wizardTap(id){
 if(Date.now()<libraryBlockClickUntil)return;
 const index=wizard.selected.indexOf(id);
 if(index<0)wizard.selected.push(id);else wizard.selected.splice(index,1);
 updateWizardGrid();
}
function toggleAllWizard(){
 const found=visibleWizardMemories();
 if(found.length&&found.every(m=>wizard.selected.includes(m.id)))wizard.selected=wizard.selected.filter(id=>!found.some(m=>m.id===id));
 else for(const m of found)if(!wizard.selected.includes(m.id))wizard.selected.push(m.id);
 updateWizardGrid();
}

function inferAlbumStyle(){if(styles[wizard.style])return wizard.style;const q=wizard.prompt.toLowerCase();if(/tạp chí|editorial|magazine/.test(q))return 'editorial';if(/nhật ký|diary|journal/.test(q))return 'journal';if(/tối giản|minimal|đơn giản/.test(q))return 'minimal';return 'scrapbook'}
function inferAlbumTheme(){if(themes[wizard.theme])return wizard.theme;const q=(wizard.prompt+' '+wizard.title).toLowerCase();if(/du lịch|đà lạt|biển|trip|travel|chuyến đi/.test(q))return 'travel';if(/yêu|cưới|wedding|đôi|hẹn hò|love/.test(q))return 'love';if(/gia đình|bố mẹ|ông bà|family|con cái/.test(q))return 'family';return 'tet'}
function generateAlbum(){
 if(!wizard.selected.length){wizard.step=2;render();notify('Hãy chọn ít nhất một kỷ niệm để tạo album.');return}
 const selected=wizard.selected.map(id=>db.memories.find(m=>m.id===id)).filter(Boolean);
 const name=wizard.title||wizard.prompt.slice(0,46)||'Chuyện của chúng mình';
 const pages=[{title:name,type:'cover',items:selected.slice(0,4).map(m=>m.id)}];
 for(let i=0;i<selected.length;i+=4){
  const group=selected.slice(i,i+4);
  pages.push({title:displayTitle(group[0]?.title),type:'collage',items:group.map(m=>m.id)});
 }
 pages.push({title:'Những điều còn ở lại ♡',type:'ending',items:selected.slice(-4).map(m=>m.id)});
 const a={id:'a'+Date.now(),title:name,prompt:wizard.prompt,theme:inferAlbumTheme(),style:inferAlbumStyle(),items:wizard.selected.slice(),pages,accepted:false};
 db.albums.unshift(a);save();clearWizardDraft();view='albums';openAlbum(a.id);notify('Đã tạo bản nháp album');
}
let albumReturnView='albums';
function openAlbum(id){readerOrigin='albums';albumReturnView='albums';activeAlbum=id;activePage=0;navigate('album')}
function current(){return db.albums.find(a=>a.id===activeAlbum)}
function albumMenu(){
 const a=current();if(!a)return;
 $('modal').classList.remove('hidden');
 $('modal').innerHTML='<div class="sheet"><button class="back" onclick="closeModal()">✕ Đóng</button><h2>'+safe(displayTitle(a.title,'Album kỷ niệm'))+'</h2><p class="muted">Quản lý album</p>'+
 '<div class="editor-panel"><button class="btn" onclick="closeModal();navigate(\'editor\')">✎ Chỉnh sửa trang</button><button class="btn" onclick="closeModal();addToAlbum()">＋ Thêm kỷ niệm</button>'+
 '<button class="btn" onclick="closeModal();renameAlbum()">✎ Đổi tên album</button><button class="btn" style="color:#a33e46" onclick="closeModal();deleteAlbum()">🗑 Xóa album</button></div></div>';
}

function bookPages(main){
 if(main)return chronicleModel().pages;
 const a=current();
 return a?(a.pages||[]).map((p,i)=>({...p,theme:p.theme||a.theme,style:p.style||a.style,variant:a.pageVariants?.[i]??(i%5)})):[];
}
function bookPaper(p,i,main){
 if(main&&p.type==='month-divider'){
  return '<div class="book-sheet-content"><div class="book-page-month"><div class="month-small">DÒNG THỜI GIAN · '+p.year+'</div><div class="month-symbol">✿</div><h2>'+safe(displayTitle(p.title))+'</h2><p>'+(p.chapterCount||0)+' câu chuyện · '+(p.memoryCount||0)+' khoảnh khắc</p></div></div>';
 }
 if(main&&p.type==='chapter-divider'){
  const photos=(p.items||[]).map(id=>db.memories.find(m=>m.id===id)).filter(m=>m?.kind==='photo'&&(mediaURLs[m.id]||m.media));
  const picHTML=photos.map(m=>'<button class="chapter-photo" type="button" data-book-photo="'+safe(m.id)+'" aria-label="Phóng to '+safe(memoryDisplayTitle(m))+'"><img alt="" loading="lazy" decoding="async" src="'+(mediaURLs[m.id]||m.media)+'"></button>').join('');
  return '<div class="book-sheet-content"><div class="book-page-chapter theme-'+safe(p.theme)+'"><div class="chapter-eyebrow">'+safe(p.subtitle||'MỘT CÂU CHUYỆN')+'</div><div class="chapter-symbol">'+safe(p.icon||'✿')+'</div><h2>'+safe(displayTitle(p.title))+'</h2><div class="chapter-photos">'+picHTML+'</div><p class="chapter-mood">'+safe(p.mood||'Một chương đáng nhớ')+'</p></div></div>';
 }
 if(main&&p.type==='chronicle-ending')return '<div class="book-sheet-content"><div class="book-page-ending"><span class="ending-flower">✿</span><h2>Câu chuyện<br>vẫn đang<br>viết tiếp…</h2><p>Mỗi khoảnh khắc mới sẽ trở thành một trang mới.</p><small>kỷniệm ♡</small></div></div>';
 const a=main?{title:'Cuốn Kỷ Niệm Của Tôi',theme:p.theme||'family',style:p.style||'scrapbook',items:[],prompt:''}:current();
 const composition=renderComposition(a,p,i,{variant:p.variant??i%5,read:true,reader:true});
 return '<div class="book-sheet-content">'+(main&&p.type==='chronicle-cover'?'<div class="book-page-cover">':'')+composition+(main&&p.type==='chronicle-cover'?'</div>':'')+'</div>';
}
function renderChronicle(){return bookReader(true)}

function renderAlbum(){return bookReader(false)}


function bookTurn(dir){BookReader.turn(dir)}
function turn(n){bookTurn(n)}
function chronicleJumpTo(i){if(view==='home')readerOrigin='home';const pages=chronicleModel().pages;chroniclePage=Math.max(0,Math.min(i,pages.length-1));closeModal();navigate('chronicle')}
function chronicleContents(){
 const model=chronicleModel();
 const entries=model.pages.map((p,i)=>{
  if(p.type==='month-divider')return '<div class="chronicle-month-heading">'+safe(displayTitle(p.title))+'</div>';
  if(p.type==='chapter-divider')return '<button onclick="chronicleJumpTo('+i+')"><b>'+safe(displayTitle(p.title))+'</b><small>Trang '+(i+1)+' ↗</small></button>';

 }).join('');

 '<div class="chronicle-contents-list"><button onclick="chronicleJumpTo(0)"><b>Bìa cuốn sách</b><small>Trang 1 ↗</small></button>'+entries+'</div></div>';

function openChronicleManage(){navigate('chronicle-manage')}
function renderChronicleManage(){
 const model=chronicleModel(),hidden=chronicleSettings().excludedIds;
 const blocks=model.chapters.map(ch=>{
  const items=ch.items.map(m=>'<button type="button" onclick="excludeChronicleMemory(\''+m.id+'\')" title="Ẩn khỏi cuốn kỷ niệm">'+safe(memoryDisplayTitle(m))+' ×</button>').join('');
  return '<div class="chronicle-manage-event"><h3>'+safe(ch.title||ch.rawTitle)+'</h3><small>'+safe(vietnamMonth(+ch.monthKey.slice(5)))+' '+ch.monthKey.slice(0,4)+' · '+ch.items.length+' kỷ niệm · '+safe(ch.mood)+'</small>'+
  '<div class="event-items">'+items+'</div><button class="btn" style="margin-top:12px;width:100%" onclick="editChronicleChapter(\''+ch.key+'\')">✎ Tên chương · Mood · Phong cách</button></div>';
 }).join('');
 const excluded=hidden.map(id=>db.memories.find(m=>m.id===id)).filter(Boolean);
 return '<section class="section"><button class="back" onclick="navigate(\'chronicle\')">← Về cuốn sách</button><div class="eyebrow">TÙY CHỈNH CUỐN KỶ NIỆM</div><h1 class="title">Những chương đời</h1>'+
 '<p class="muted">Cuốn sách tự cập nhật khi bạn lưu kỷ niệm mới. Đổi tên chương, chọn cảm xúc hoặc ẩn những khoảnh khắc riêng tư mà không xóa ảnh gốc.</p>'+
 '<div class="panel-warning">Mốc thời gian lấy từ ngày kỷ niệm. Nếu kỷ niệm nằm sai tháng hoặc chương, hãy sửa ngày và tên sự kiện trong Thư viện.</div>'+
 '<h2 style="font:24px Georgia,serif">Các chương ('+model.chapters.length+')</h2>'+
 '<div class="chronicle-manage-list">'+(blocks||'<div class="chronicle-empty">Chưa có chương nào. Hãy lưu kỷ niệm đầu tiên vào Thư viện. ♡</div>')+'</div>'+
 '<h2 style="font:23px Georgia,serif;margin-top:27px">Không đưa vào sách ('+excluded.length+')</h2>'+
 '<p class="muted">Ảnh vẫn còn trong Thư viện và trong các album riêng.</p>'+
 '<div class="chronicle-manage-list">'+(excluded.map(m=>'<div class="trash-item"><div class="trash-desc"><b>'+safe(memoryDisplayTitle(m))+'</b><small>'+safe(m.date||'')+'</small></div><button onclick="restoreChronicleMemory(\''+m.id+'\')">＋ Đưa lại</button></div>').join('')||'<p class="muted">Chưa có kỷ niệm bị ẩn.</p>')+'</div>'+
 '<button class="btn primary" style="width:100%;margin:23px 0 18px" onclick="navigate(\'chronicle\')">Xem cuốn sách ↗</button></section>';
}
function excludeChronicleMemory(id){
 const m=db.memories.find(x=>x.id===id);
 if(!m||!confirm('Ẩn "'+memoryDisplayTitle(m)+'" khỏi Cuốn Kỷ Niệm Của Tôi? Ảnh gốc và album riêng vẫn được giữ.'))return;
 const c=chronicleSettings();if(!c.excludedIds.includes(id))c.excludedIds.push(id);
 save();render();notify('Đã ẩn khỏi cuốn sách, ảnh gốc vẫn được giữ');
}
function restoreChronicleMemory(id){
 const c=chronicleSettings();c.excludedIds=c.excludedIds.filter(x=>x!==id);
 save();render();notify('Kỷ niệm đã trở lại cuốn sách');
}
function editChronicleChapter(key){
 const c=chronicleModel().chapters.find(x=>x.key===key);if(!c)return;
 const themeOptions=Object.entries(themes).map(([id,t])=>'<option value="'+id+'" '+(c.theme===id?'selected':'')+'>'+safe(t[0])+'</option>').join('');
 const styleOptions=Object.entries(styles).map(([id,t])=>'<option value="'+id+'" '+(c.style===id?'selected':'')+'>'+safe(t)+'</option>').join('');
 $('modal').classList.remove('hidden');
 $('modal').innerHTML='<div class="sheet"><button class="back" onclick="closeModal()">✕ Đóng</button><h2>Thiết kế chương</h2>'+
 '<p class="muted">'+safe(c.monthKey)+' · '+c.items.length+' kỷ niệm. Thay đổi sẽ áp dụng cho chương này, không ảnh hưởng chương khác.</p>'+
 '<label class="label" for="chapterTitle">Tên chương</label><input class="field" id="chapterTitle" maxlength="90" value="'+safe(c.title||c.rawTitle)+'">'+
 '<label class="label" for="chapterMood">Cảm xúc của chương</label><input class="field" id="chapterMood" maxlength="90" value="'+safe(c.mood)+'">'+
 '<label class="label" for="chapterTheme">Chủ đề hình ảnh</label><select class="field" id="chapterTheme">'+themeOptions+'</select>'+
 '<label class="label" for="chapterStyle">Phong cách bố cục</label><select class="field" id="chapterStyle">'+styleOptions+'</select>'+
 '<button class="btn primary" style="width:100%;margin-top:12px" onclick="saveChronicleChapter(\''+key+'\')">✓ Lưu chương</button></div>';
}
function saveChronicleChapter(key){
 const chapter=chronicleModel().chapters.find(x=>x.key===key);if(!chapter)return;
 const config=chronicleSettings();
 config.chapters[key]={title:$('chapterTitle').value.trim().slice(0,90)||chapter.rawTitle,mood:$('chapterMood').value.trim().slice(0,90)||chapter.mood,theme:themes[$('chapterTheme').value]?$('chapterTheme').value:chapter.theme,style:styles[$('chapterStyle').value]?$('chapterStyle').value:chapter.style};
 save();closeModal();render();notify('Đã cập nhật chương');
}


function editChroniclePage(){
 const p=chronicleModel().pages[chroniclePage];
 if(!p||p.type!=='chronicle-story')return;
 const variants=['Tranh ghép cổ điển','Tạp chí lễ hội','Polaroid nghệ thuật','Nhật ký dịu dàng','Editorial tối giản'];
 const layouts=variants.map((label,i)=>'<option value="'+i+'" '+(p.variant===i?'selected':'')+'>'+label+'</option>').join('');
 $('modal').classList.remove('hidden');
 $('modal').innerHTML='<div class="sheet"><button class="back" onclick="closeModal()">✕ Đóng</button><h2>Chỉnh trang kỷ niệm</h2>'+
 '<p class="muted">Lời nhắn và bố cục của trang này sẽ được giữ riêng, dù cuốn sách tiếp tục cập nhật kỷ niệm khác.</p>'+
 '<label class="label" for="chronPageTitle">Tiêu đề</label><input class="field" id="chronPageTitle" maxlength="120" value="'+safe(displayTitle(p.title))+'">'+
 '<label class="label" for="chronPageCaption">Lời nhắn</label><textarea class="field" id="chronPageCaption" rows="3" maxlength="300">'+safe(p.caption||'')+'</textarea>'+
 '<label class="label" for="chronPageVariant">Kiểu bố cục</label><select class="field" id="chronPageVariant">'+layouts+'</select>'+
 '<button class="btn primary" style="width:100%" onclick="saveChroniclePage()">✓ Lưu trang</button></div>';
}
function saveChroniclePage(){
 const p=chronicleModel().pages[chroniclePage];if(!p||p.type!=='chronicle-story')return;
 const c=chronicleSettings(),v=Number($('chronPageVariant').value);
 c.pageEdits[p.id]={title:$('chronPageTitle').value.trim().slice(0,120)||p.title,caption:$('chronPageCaption').value.trim().slice(0,300),variant:Math.max(0,Math.min(4,Number.isFinite(v)?v:p.variant))};
 save();closeModal();render();notify('Đã cập nhật trang kỷ niệm');
}

function editPageText(field,value){
 const a=current();if(!a)return;const p=a.pages[activePage];p[field]=String(value||'').slice(0,300);
 a.accepted=false;save();
 const preview=$('editorPreview');if(preview)preview.innerHTML=renderComposition(a,p,activePage,{variant:a.pageVariants?.[activePage]??activePage%5,read:true});
}
function renderEditor(){
 const a=current();if(!a)return '<section class="section">Album không tồn tại.</section>';
 const p=a.pages[activePage];
 const caption=p.caption!==undefined?p.caption:((p.items||[]).map(id=>db.memories.find(m=>m.id===id)).find(m=>m?.note)?.note||a.prompt||'');
 return '<section class="section"><div class="album-toolbar"><button class="back" onclick="navigate(\'album\')">← Xem album</button><span class="eyebrow">CHỈNH SỬA TRANG</span></div>'+
 '<h1 class="editor-heading">'+safe(displayTitle(a.title,'Album kỷ niệm'))+'</h1><p class="editor-note">Trang '+(activePage+1)+'/'+a.pages.length+' · Thay đổi được lưu ngay trên thiết bị.</p>'+
 '<div id="editorPreview">'+renderComposition(a,p,activePage,{variant:a.pageVariants?.[activePage]??activePage%5,read:true})+'</div>'+
 '<div class="editor-panel"><label class="label" for="pageTitleEdit">Tiêu đề trang</label><input class="field" id="pageTitleEdit" value="'+safe(displayTitle(p.title,''))+'" maxlength="120" oninput="editPageText(\'title\',this.value)">'+
 '<label class="label" for="pageCaptionEdit">Lời nhắn trên trang</label><textarea class="field" id="pageCaptionEdit" rows="3" maxlength="300" oninput="editPageText(\'caption\',this.value)">'+safe(caption)+'</textarea></div>'+
 '<div class="row" style="margin-top:14px"><button class="btn" onclick="redesign()">✦ Đổi bố cục</button><button class="btn" onclick="addToAlbum()">＋ Thêm ảnh/video</button></div>'+
 '<div class="row" style="margin-top:10px"><button class="btn" onclick="editNavigatePage(-1)" '+(activePage===0?'disabled':'')+'>← Trang trước</button><button class="btn" onclick="editNavigatePage(1)" '+(activePage===a.pages.length-1?'disabled':'')+'>Trang sau →</button></div>'+
 '<p class="editor-note" style="margin-top:20px">Đây là trình chỉnh sửa cơ bản. Kéo thả đối tượng, tách nền và chỉnh nhạc đa lớp sẽ được phát triển ở giai đoạn Editor nâng cao.</p></section>';
}
function editNavigatePage(n){const a=current();activePage=Math.max(0,Math.min(a.pages.length-1,activePage+n));render();scrollTo(0,0)}

function acceptAlbum(){current().accepted=true;save();render();notify('Đã lưu album')}
function redesign(){const a=current();a.pageVariants=a.pageVariants||{};a.pageVariants[activePage]=((a.pageVariants[activePage]??activePage%5)+1)%5;a.accepted=false;save();render();notify('Đã đổi bố cục trang '+(activePage+1)+', giữ nguyên nội dung gốc')}
function addToAlbum(){
 const a=current(),available=db.memories.filter(m=>!(a.items||[]).includes(m.id));
 $('modal').classList.remove('hidden');
 const tiles=available.map(m=>{
  const src=mediaURLs[m.id]||m.media||'';
  const art=m.kind==='photo'&&src?'<img loading="lazy" style="width:100%;height:100%;object-fit:cover" src="'+src+'">':
   m.kind==='video'&&src?'<video muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;pointer-events:none" src="'+src+'"></video>':'<span>'+ (m.kind==='note'?'📝':'📷')+'</span>';
  return '<button class="library-tile" onclick="attach(\''+m.id+'\')" aria-label="Thêm '+safe(memoryDisplayTitle(m))+' vào album">'+art+'<span class="tick" style="background:#9f6066">＋</span></button>';
 }).join('');
 $('modal').innerHTML='<div class="sheet"><button class="back" onclick="closeModal()">✕ Đóng</button><h2>Thêm kỷ niệm vào album</h2><p class="muted">Chạm vào ảnh hoặc video để thêm vào album. Kỷ niệm gốc không bị thay đổi.</p>'+
 (tiles?'<div class="library-grid" style="--library-cols:3">'+tiles+'</div>':'<p class="notice">Tất cả kỷ niệm đã có trong album. Vào Thư viện để lưu thêm.</p>')+'</div>';
}
function attach(id){const a=current(),m=db.memories.find(x=>x.id===id);a.items.push(id);a.pages.splice(Math.max(a.pages.length-1,0),0,{title:memoryDisplayTitle(m),type:'collage',items:[id]});save();closeModal();render();notify('Đã thêm, không ảnh hưởng bản gốc')}
function renameAlbum(){const a=current();if(!a)return;const name=prompt('Đổi tên album',displayTitle(a.title,'Album kỷ niệm'));if(!name?.trim())return;a.title=name.trim().slice(0,120);save();render();notify('Đã đổi tên album')}
function deleteAlbum(){const a=current();if(!a||!confirm('Chuyển album này vào Thùng rác? Các ảnh và video gốc vẫn ở Thư viện.'))return;db.albumTrash.unshift({album:a,deletedAt:Date.now()});db.albums=db.albums.filter(x=>x.id!==a.id);save();navigate('albums');notify('Đã chuyển album vào Thùng rác')}
function restoreAlbum(id){const i=db.albumTrash.findIndex(x=>x.album.id===id);if(i<0)return;const x=db.albumTrash.splice(i,1)[0];db.albums.unshift(x.album);save();render();notify('Đã khôi phục album')}
function permanentlyDeleteAlbum(id){if(!confirm('Xóa vĩnh viễn album này? Ảnh/video gốc vẫn được giữ.'))return;db.albumTrash=db.albumTrash.filter(x=>x.album.id!==id);save();render();notify('Đã xóa album vĩnh viễn')}
function shareAlbum(){notify('Tính năng chia sẻ sẽ có trong phiên bản sau; album hiện chỉ lưu trên máy này.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewedMemoryId)closeViewer();else if(!$('modal').classList.contains('hidden'))closeModal()}else if(viewedMemoryId&&e.key==='ArrowRight')stepViewer(1);else if(viewedMemoryId&&e.key==='ArrowLeft')stepViewer(-1);else if((['chronicle','album'].includes(view)||(view==='home'&&!!document.activeElement?.closest?.('.home-book-feature')))&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){if(e.key==='ArrowRight'){e.preventDefault();bookTurn(1)}else if(e.key==='ArrowLeft'){e.preventDefault();bookTurn(-1)}}});
hydrateMedia();
</script></body></html>
